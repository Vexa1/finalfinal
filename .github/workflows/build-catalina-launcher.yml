# Builds Horizon's launcher for macOS 10.15 (Catalina) on GitHub's Intel Mac runner and packages it as a
# .dmg and a .zip. Run it from the Actions tab ("Run workflow"); the files appear as the run's artifact.
name: Build Horizon launcher for macOS 10.15

on:
  workflow_dispatch:

env:
  # The upstream commit the patch was made and checked against. Do not change it without a new patch.
  UPSTREAM_SHA: 4fe3ed58b4718b2c003c8621f0cec1d233ecf289
  # Every C dependency and rustc target 10.15, not the runner's macOS 15.
  MACOSX_DEPLOYMENT_TARGET: "10.15"

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: ${{ env.UPSTREAM_SHA }}
          path: src
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable

      - name: Apply the Catalina patch
        run: |
          cd src
          git apply --whitespace=nowarn ../horizon-catalina.patch
          rustc --version

      - name: Keep the launcher from updating itself
        # The official launcher does not start on 10.15: an update would replace this build with it.
        run: |
          plist=src/packaging/macos/Info.plist
          /usr/libexec/PlistBuddy -c "Add :LSEnvironment dict" "$plist"
          /usr/libexec/PlistBuddy -c "Add :LSEnvironment:HORIZON_LAUNCHER_NO_SELF_UPDATE string 1" "$plist"
          plutil -lint "$plist"
          grep -A1 LSMinimumSystemVersion "$plist"

      - name: Build the launcher
        # runtime_shaders: GPUI compiles its Metal shaders when the launcher starts (as MSL 2.2), so the
        # runner needs no Metal toolchain and the shaders do not depend on its Xcode's minimum version.
        working-directory: src/launcher
        run: cargo build --release --locked --features gpui_platform/runtime_shaders

      - name: The macOS 10.15 SDK's symbol lists
        # Downloaded as one file; symcheck.py reads it directly (macOS's tar has no --wildcards).
        run: |
          curl -fsSL -o sdk.tar.xz https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.15.sdk.tar.xz
          ls -la sdk.tar.xz
          pip3 install --break-system-packages --quiet lief || pip3 install --quiet lief

      - name: Gate - the launcher loads on 10.15
        run: python3 symcheck.py sdk.tar.xz src/launcher/target/release/horizon-launcher

      - name: The game's prebuilt programs, checked the same way
        run: |
          curl -fsSL -o horizon-macos-x64.zip https://github.com/horizon-rust/horizon/releases/download/nightly/horizon-macos-x64.zip
          mkdir game && unzip -q horizon-macos-x64.zip -d game
          python3 symcheck.py sdk.tar.xz game/horizon-macos-x64/horizon-client game/horizon-macos-x64/horizon-ctl \
            game/horizon-macos-x64/horizon-server game/horizon-macos-x64/horizon-prepare

      - name: Package Horizon.app as .dmg and .zip
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg" && "$RUNNER_TEMP/dmg/bin/pip" install --quiet dmgbuild==1.6.5
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/launcher/Cargo.toml | head -1)
          mkdir -p out
          DMGBUILD="$RUNNER_TEMP/dmg/bin/dmgbuild" src/packaging/macos/package.sh \
            src/launcher/target/release/horizon-launcher "$version" out x64
          rm -rf out/Horizon.app
          cp horizon-macos-x64.zip out/horizon-game-programs-macos-x64.zip
          ls -la out
          # The packaged app's own files, after signing.
          hdiutil attach -nobrowse -mountpoint /tmp/dmgcheck out/horizon-launcher-macos-x64.dmg
          plutil -p /tmp/dmgcheck/Horizon.app/Contents/Info.plist | grep -E "LSMinimum|SELF_UPDATE"
          hdiutil detach /tmp/dmgcheck

      - uses: actions/upload-artifact@v4
        with:
          name: Horizon-for-macOS-10.15
          path: out/*
          if-no-files-found: error
